<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ほたるの夜</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one full-bleed night-field canvas; HUD pinned to the safe-area corners; menus as a centered paper-lantern card. Single dark look by choice. */
:root {
  --night: #0b1424;
  --night-deep: #050a14;
  --ink: #e9efe2;
  --ink-dim: #9aa8a0;
  --glow: #d9f26b;
  --ember: #f2a65a;
  --danger: #e06d6d;
  --card: rgba(10, 20, 34, 0.82);
  --font-display: "Kaisei Decol", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night-deep);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#stage { position: fixed; inset: 0; }
canvas { display: block; width: 100%; height: 100%; cursor: none; }
.hud {
  position: fixed; left: 0; right: 0; top: 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.hud .label { font-size: 11px; letter-spacing: 0.14em; color: var(--ink-dim); }
.hud .score { font-family: var(--font-display); font-size: 30px; line-height: 1.1; color: var(--glow); text-shadow: 0 0 12px rgba(217, 242, 107, 0.45); }
.hud .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.lives { display: flex; gap: 6px; }
.lives span { width: 12px; height: 12px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 10px var(--ember); }
.lives span.off { background: transparent; box-shadow: none; border: 1px solid rgba(242, 166, 90, 0.35); width: 10px; height: 10px; }
.hud button {
  pointer-events: auto; font: inherit; font-size: 12px; color: var(--ink-dim);
  background: transparent; border: 1px solid rgba(154, 168, 160, 0.35); border-radius: 999px; padding: 3px 10px; cursor: pointer;
}
.hud button:focus-visible, .card button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.overlay {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
.card {
  width: min(380px, 100%);
  background: var(--card);
  border: 1px solid rgba(217, 242, 107, 0.18);
  border-radius: 18px;
  padding: 28px 24px 24px;
  text-align: center;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex; flex-direction: column; gap: 14px;
}
.card h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 40px; letter-spacing: 0.08em;
  color: var(--glow); text-shadow: 0 0 18px rgba(217, 242, 107, 0.5); text-wrap: balance;
}
.card .sub { margin: 0; font-size: 13px; letter-spacing: 0.2em; color: var(--ink-dim); }
.card ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 8px; text-align: left; font-size: 14px; line-height: 1.6; }
.card li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: baseline; }
.card li i { font-style: normal; text-align: center; }
.dot-g { color: var(--glow); }
.dot-y { color: #ffd76a; }
.dot-r { color: var(--danger); }
.card .result { font-family: var(--font-display); font-size: 48px; color: var(--glow); margin: 0; font-variant-numeric: tabular-nums; }
.card .best { margin: 0; font-size: 14px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.card .best b { color: var(--ember); }
.card .controls { font-size: 12px; color: var(--ink-dim); margin: 0; line-height: 1.6; }
.card button.primary {
  font: inherit; font-weight: 700; font-size: 17px; letter-spacing: 0.1em;
  color: var(--night-deep); background: var(--glow);
  border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer;
  box-shadow: 0 0 22px rgba(217, 242, 107, 0.35);
}
.card button.primary:hover { filter: brightness(1.08); }
@media (prefers-reduced-motion: reduce) { .card button.primary { box-shadow: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<div class="hud">
  <div>
    <div class="label">SCORE</div>
    <div class="score" id="score">0</div>
  </div>
  <div class="right">
    <div class="lives" id="lives"></div>
    <button id="mute" type="button">音 ON</button>
  </div>
</div>

<div class="overlay" id="title">
  <div class="card">
    <p class="sub">FIREFLY NIGHT</p>
    <h1>ほたるの夜</h1>
    <ul>
      <li><i class="dot-g">●</i><span>光っているホタルを網でつかまえる。消えている間は網をすり抜けます。</span></li>
      <li><i class="dot-y">★</i><span>金色のホタルは50点。コウモリがしばらく遅くなります。</span></li>
      <li><i class="dot-r">▲</i><span>コウモリに当たると灯がひとつ消えます。3つ消えたら終わり。</span></li>
    </ul>
    <p class="controls">続けてつかまえるとコンボ倍率が上がります。<br>操作：指やマウスで網を動かす ／ 矢印キー・WASD</p>
    <button class="primary" id="start" type="button">はじめる</button>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="card">
    <p class="sub">夜が明けました</p>
    <p class="result" id="final">0</p>
    <p class="best">最高記録 <b id="best">0</b></p>
    <p class="controls" id="stats"></p>
    <button class="primary" id="retry" type="button">もう一度</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), livesEl = $('lives');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, DPR = 1;
  let bg = null; // offscreen background

  // ---------- storage (best score) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // ---------- audio ----------
  let actx = null, muted = store.get('hotaru-muted', false);
  const muteBtn = $('mute');
  const syncMute = () => { muteBtn.textContent = muted ? '音 OFF' : '音 ON'; };
  syncMute();
  muteBtn.addEventListener('click', e => { e.stopPropagation(); muted = !muted; store.set('hotaru-muted', muted); syncMute(); ensureAudio(); });
  function ensureAudio() {
    if (actx || muted) return;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  function tone(freq, dur = 0.18, type = 'sine', vol = 0.12, slide = 0) {
    if (!actx || muted) return;
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
  const sfxCatch = combo => { const n = PENTA[Math.min(combo - 1, PENTA.length - 1)]; tone(523.25 * Math.pow(2, n / 12), 0.22, 'triangle', 0.1); };
  const sfxGold = () => { tone(880, 0.3, 'sine', 0.09); setTimeout(() => tone(1318.5, 0.35, 'sine', 0.08), 70); };
  const sfxHit = () => tone(220, 0.35, 'sawtooth', 0.08, -140);

  // ---------- resize & background ----------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildBackground();
    if (net) { net.x = clamp(net.x, 0, W); net.y = clamp(net.y, 0, H); }
  }
  function buildBackground() {
    bg = document.createElement('canvas');
    bg.width = cv.width; bg.height = cv.height;
    const b = bg.getContext('2d');
    b.setTransform(DPR, 0, 0, DPR, 0, 0);
    const sky = b.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#050a14'); sky.addColorStop(0.55, '#0b1a2e'); sky.addColorStop(1, '#122b2a');
    b.fillStyle = sky; b.fillRect(0, 0, W, H);
    // stars
    const rnd = mulberry(7);
    const n = Math.round(W * H / 4000);
    for (let i = 0; i < n; i++) {
      const x = rnd() * W, y = rnd() * H * 0.6, r = rnd() * 1.1 + 0.2;
      b.globalAlpha = 0.25 + rnd() * 0.6;
      b.fillStyle = '#dfe8ff';
      b.beginPath(); b.arc(x, y, r, 0, Math.PI * 2); b.fill();
    }
    b.globalAlpha = 1;
    // moon
    const mx = W * 0.8, my = Math.max(90, H * 0.16), mr = Math.min(W, H) * 0.06 + 10;
    const halo = b.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 4);
    halo.addColorStop(0, 'rgba(240,236,210,0.18)'); halo.addColorStop(1, 'rgba(240,236,210,0)');
    b.fillStyle = halo; b.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
    // crescent: cut the bite out on its own layer so no dark disc shows over the halo
    const m = document.createElement('canvas'); m.width = bg.width; m.height = bg.height;
    const mc = m.getContext('2d'); mc.setTransform(DPR, 0, 0, DPR, 0, 0);
    mc.fillStyle = '#efe9cf'; mc.beginPath(); mc.arc(mx, my, mr, 0, Math.PI * 2); mc.fill();
    mc.globalCompositeOperation = 'destination-out';
    mc.beginPath(); mc.arc(mx + mr * 0.45, my - mr * 0.15, mr * 0.92, 0, Math.PI * 2); mc.fill();
    b.drawImage(m, 0, 0, W, H);
    // far hills
    b.fillStyle = '#0a1a22';
    b.beginPath(); b.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) b.lineTo(x, H * 0.72 + Math.sin(x * 0.006) * 28 + Math.sin(x * 0.017 + 1) * 10);
    b.lineTo(W, H); b.closePath(); b.fill();
    // river glint
    const rv = b.createLinearGradient(0, H * 0.8, 0, H * 0.86);
    rv.addColorStop(0, 'rgba(120,160,190,0)'); rv.addColorStop(0.5, 'rgba(120,160,190,0.10)'); rv.addColorStop(1, 'rgba(120,160,190,0)');
    b.fillStyle = rv; b.fillRect(0, H * 0.8, W, H * 0.06);
    // near reeds
    b.strokeStyle = '#04100f'; b.lineCap = 'round';
    const reeds = Math.round(W / 6);
    for (let i = 0; i < reeds; i++) {
      const x = rnd() * W, h = 40 + rnd() * H * 0.18, lean = (rnd() - 0.5) * 30;
      b.lineWidth = 1 + rnd() * 2;
      b.beginPath(); b.moveTo(x, H + 4); b.quadraticCurveTo(x + lean * 0.3, H - h * 0.6, x + lean, H - h); b.stroke();
    }
    b.fillStyle = '#04100f'; b.fillRect(0, H - 18, W, 18);
  }

  // ---------- utils ----------
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const dist2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };

  // ---------- state ----------
  let state = 'title'; // title | play | over
  let net = null, flies = [], bats = [], parts = [], pops = [];
  let score = 0, lives = 3, combo = 0, comboTimer = 0, maxCombo = 0, caught = 0;
  let t = 0, batTimer = 0, slowTimer = 0, invuln = 0, shake = 0;
  let best = store.get('hotaru-best', 0);
  const keys = new Set();
  let pointer = null;

  function reset() {
    net = { x: W / 2, y: H * 0.6, r: Math.max(26, Math.min(W, H) * 0.05) };
    flies = []; bats = []; parts = []; pops = [];
    score = 0; lives = 3; combo = 0; comboTimer = 0; maxCombo = 0; caught = 0;
    t = 0; batTimer = 2.5; slowTimer = 0; invuln = 0; shake = 0;
    for (let i = 0; i < 8; i++) flies.push(makeFly());
    renderHud();
  }

  function makeFly(gold = false) {
    const a = rand(0, Math.PI * 2);
    return {
      x: rand(30, W - 30), y: rand(H * 0.15, H * 0.85),
      vx: Math.cos(a) * 30, vy: Math.sin(a) * 30,
      heading: a, phase: rand(0, 1), period: rand(1.8, 3.4),
      gold, life: gold ? 7 : Infinity, born: 0
    };
  }
  const isLit = f => f.gold || ((t / f.period + f.phase) % 1) < 0.5;
  const litAmount = f => {
    if (f.gold) return 1;
    const p = (t / f.period + f.phase) % 1;
    if (p < 0.5) return Math.sin(p / 0.5 * Math.PI) * 0.6 + 0.4;
    return 0;
  };

  function makeBat() {
    const fromLeft = Math.random() < 0.5;
    const level = Math.min(t / 60, 2);
    const speed = rand(110, 160) + level * 70;
    return {
      x: fromLeft ? -40 : W + 40, y: rand(H * 0.12, H * 0.8),
      baseY: 0, dir: fromLeft ? 1 : -1, speed,
      amp: rand(20, 70), freq: rand(1.5, 3), ph: rand(0, 6), age: 0,
      homing: Math.random() < Math.min(0.15 + t / 200, 0.6)
    };
  }

  // ---------- input ----------
  function setPointer(e) {
    const r = cv.getBoundingClientRect();
    // On touch, lift the target a bit so the finger does not cover the net
    const lift = e.pointerType === 'touch' ? 50 : 0;
    pointer = { x: e.clientX - r.left, y: e.clientY - r.top - lift };
  }
  cv.addEventListener('pointerdown', e => { setPointer(e); ensureAudio(); });
  cv.addEventListener('pointermove', e => { if (e.pointerType !== 'touch' || e.buttons) setPointer(e); });
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(k)) { keys.add(k); pointer = null; e.preventDefault(); }
    if ((k === 'enter' || k === ' ') && state !== 'play') { e.preventDefault(); start(); }
  });
  window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  window.addEventListener('blur', () => keys.clear());

  // ---------- flow ----------
  function start() {
    ensureAudio();
    if (actx && actx.state === 'suspended') actx.resume();
    $('title').hidden = true; $('over').hidden = true;
    reset(); state = 'play';
  }
  function gameOver() {
    state = 'over';
    if (score > best) { best = score; store.set('hotaru-best', best); }
    $('final').textContent = score.toLocaleString();
    $('best').textContent = best.toLocaleString();
    $('stats').textContent = `つかまえた数 ${caught}　最大コンボ ${maxCombo}　生きのびた時間 ${Math.floor(t)}秒`;
    $('over').hidden = false;
    setTimeout(() => $('retry').focus(), 50);
  }
  $('start').addEventListener('click', start);
  $('retry').addEventListener('click', start);

  function renderHud() {
    scoreEl.textContent = score.toLocaleString();
    livesEl.innerHTML = '';
    for (let i = 0; i < 3; i++) { const s = document.createElement('span'); if (i >= lives) s.className = 'off'; livesEl.appendChild(s); }
  }

  // ---------- update ----------
  function update(dt) {
    t += dt;
    // net movement
    if (pointer) {
      const k = 1 - Math.pow(0.0005, dt);
      net.x += (pointer.x - net.x) * k; net.y += (pointer.y - net.y) * k;
    } else {
      let dx = 0, dy = 0;
      if (keys.has('arrowleft') || keys.has('a')) dx -= 1;
      if (keys.has('arrowright') || keys.has('d')) dx += 1;
      if (keys.has('arrowup') || keys.has('w')) dy -= 1;
      if (keys.has('arrowdown') || keys.has('s')) dy += 1;
      const len = Math.hypot(dx, dy) || 1, sp = 380;
      net.x += dx / len * sp * dt; net.y += dy / len * sp * dt;
    }
    net.x = clamp(net.x, 0, W); net.y = clamp(net.y, 0, H);

    // fireflies
    for (const f of flies) {
      f.heading += rand(-2.5, 2.5) * dt;
      const sp = f.gold ? 70 : 34 + Math.min(t, 120) * 0.15;
      f.vx += (Math.cos(f.heading) * sp - f.vx) * dt * 2;
      f.vy += (Math.sin(f.heading) * sp - f.vy) * dt * 2;
      // shy: drift away from net a little
      const d = Math.sqrt(dist2(f, net));
      if (d < 120 && d > 1) { f.vx += (f.x - net.x) / d * 40 * dt; f.vy += (f.y - net.y) / d * 40 * dt; }
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.x < 20) { f.x = 20; f.heading = 0; }
      if (f.x > W - 20) { f.x = W - 20; f.heading = Math.PI; }
      if (f.y < H * 0.1) { f.y = H * 0.1; f.heading = Math.PI / 2; }
      if (f.y > H - 40) { f.y = H - 40; f.heading = -Math.PI / 2; }
      f.life -= dt; f.born += dt;
    }
    flies = flies.filter(f => f.life > 0);

    // catching
    const cr = net.r + 6;
    for (let i = flies.length - 1; i >= 0; i--) {
      const f = flies[i];
      if (isLit(f) && dist2(f, net) < cr * cr) {
        flies.splice(i, 1);
        combo = comboTimer > 0 ? combo + 1 : 1;
        comboTimer = 1.6;
        maxCombo = Math.max(maxCombo, combo);
        caught++;
        const mult = Math.min(combo, 10);
        const pts = (f.gold ? 50 : 10) * mult;
        score += pts;
        if (f.gold) { slowTimer = 5; sfxGold(); } else sfxCatch(combo);
        pops.push({ x: f.x, y: f.y - 10, text: combo > 1 ? `+${pts} ×${mult}` : `+${pts}`, age: 0, gold: f.gold });
        burst(f.x, f.y, f.gold ? '#ffd76a' : '#d9f26b', f.gold ? 26 : 14);
        renderHud();
      }
    }
    if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }

    // keep population
    const target = 8 + Math.floor(Math.min(t, 120) / 30);
    while (flies.filter(f => !f.gold).length < target) flies.push(makeFly());
    if (!flies.some(f => f.gold) && Math.random() < dt / 14) flies.push(makeFly(true));

    // bats
    batTimer -= dt;
    if (batTimer <= 0) {
      bats.push(makeBat());
      batTimer = Math.max(0.55, 2.6 - t * 0.022) * rand(0.7, 1.3);
    }
    const slow = slowTimer > 0 ? 0.45 : 1;
    if (slowTimer > 0) slowTimer -= dt;
    for (const b of bats) {
      b.age += dt;
      if (!b.baseY) b.baseY = b.y;
      if (b.homing) b.baseY += clamp(net.y - b.baseY, -1, 1) * 45 * dt * slow;
      b.x += b.dir * b.speed * dt * slow;
      b.y = b.baseY + Math.sin(b.age * b.freq + b.ph) * b.amp;
    }
    bats = bats.filter(b => b.x > -80 && b.x < W + 80);

    if (invuln > 0) invuln -= dt;
    else {
      for (const b of bats) {
        const rr = net.r * 0.75 + 12;
        if (dist2(b, net) < rr * rr) {
          lives--; invuln = 1.6; shake = 0.35; combo = 0; comboTimer = 0;
          sfxHit(); burst(net.x, net.y, '#e06d6d', 18);
          renderHud();
          if (navigator.vibrate) try { navigator.vibrate(80); } catch (e) {}
          if (lives <= 0) { gameOver(); }
          break;
        }
      }
    }

    // particles
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 30 * dt; p.vx *= 0.98; p.age += dt; }
    parts = parts.filter(p => p.age < p.life);
    for (const p of pops) p.age += dt;
    pops = pops.filter(p => p.age < 1);
    if (shake > 0) shake -= dt;
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(30, 140);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, age: 0, life: rand(0.4, 0.9), color });
    }
  }

  // ---------- idle (title / over) ambience ----------
  let ambient = [];
  function updateAmbient(dt) {
    t += dt;
    while (ambient.length < 14) ambient.push(makeFly());
    for (const f of ambient) {
      f.heading += rand(-2, 2) * dt;
      f.x += Math.cos(f.heading) * 25 * dt; f.y += Math.sin(f.heading) * 25 * dt;
      if (f.x < 0 || f.x > W || f.y < H * 0.1 || f.y > H) Object.assign(f, makeFly());
    }
  }

  // ---------- draw ----------
  function drawFly(f) {
    const a = litAmount(f);
    const fade = f.gold && f.life < 1.5 ? (Math.sin(t * 20) > 0 ? 1 : 0.3) : 1;
    const born = Math.min(f.born / 0.6, 1);
    // body (always faintly visible)
    ctx.fillStyle = 'rgba(160,170,120,0.35)';
    ctx.beginPath(); ctx.arc(f.x, f.y, 1.6, 0, Math.PI * 2); ctx.fill();
    if (a <= 0) return;
    const col = f.gold ? '255,215,106' : '217,242,107';
    const R = (f.gold ? 34 : 22) * (0.6 + a * 0.4);
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, R);
    g.addColorStop(0, `rgba(${col},${0.9 * a * fade * born})`);
    g.addColorStop(0.25, `rgba(${col},${0.35 * a * fade * born})`);
    g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(f.x, f.y, R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,255,230,${a * fade * born})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.gold ? 3 : 2.2, 0, Math.PI * 2); ctx.fill();
  }

  function drawBat(b) {
    const flap = Math.sin(b.age * 18);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(b.dir, 1);
    ctx.fillStyle = slowTimer > 0 ? '#3a3550' : '#1a1222';
    ctx.strokeStyle = 'rgba(224,109,109,0.55)';
    ctx.lineWidth = 1.2;
    const wy = flap * 10;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-8, -6 - wy, -22, -4 - wy * 1.4);
    ctx.quadraticCurveTo(-18, 2, -14, 3);
    ctx.quadraticCurveTo(-10, 1, -6, 5);
    ctx.quadraticCurveTo(-3, 3, 0, 6);
    ctx.quadraticCurveTo(3, 3, 6, 5);
    ctx.quadraticCurveTo(10, 1, 14, 3);
    ctx.quadraticCurveTo(18, 2, 22, -4 - wy * 1.4);
    ctx.quadraticCurveTo(8, -6 - wy, 0, 0);
    ctx.fill(); ctx.stroke();
    // head + ears
    ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-3, -3); ctx.lineTo(-2.5, -8); ctx.lineTo(-0.5, -4); ctx.moveTo(3, -3); ctx.lineTo(2.5, -8); ctx.lineTo(0.5, -4); ctx.fill();
    ctx.fillStyle = '#e06d6d';
    ctx.beginPath(); ctx.arc(1.8, -0.5, 1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawNet() {
    if (invuln > 0 && Math.floor(invuln * 10) % 2 === 0) return;
    const { x, y, r } = net;
    // handle
    ctx.strokeStyle = 'rgba(190,150,100,0.85)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + r * 0.7, y + r * 0.7); ctx.lineTo(x + r * 1.9, y + r * 2.4); ctx.stroke();
    // mesh
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = 'rgba(233,239,226,0.06)'; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.strokeStyle = 'rgba(233,239,226,0.18)'; ctx.lineWidth = 1;
    for (let i = -r; i <= r; i += 7) {
      ctx.beginPath(); ctx.moveTo(x + i - r, y - r); ctx.lineTo(x + i + r, y + r); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + i + r, y - r); ctx.lineTo(x + i - r, y + r); ctx.stroke();
    }
    ctx.restore();
    // rim
    ctx.strokeStyle = 'rgba(233,239,226,0.85)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    // combo ring
    if (combo > 1 && comboTimer > 0) {
      ctx.strokeStyle = 'rgba(217,242,107,0.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, r + 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (comboTimer / 1.6)); ctx.stroke();
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0 && !reduceMotion) ctx.translate(rand(-6, 6) * shake / 0.35, rand(-6, 6) * shake / 0.35);
    ctx.drawImage(bg, 0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const list = state === 'play' ? flies : ambient;
    for (const f of list) drawFly(f);
    for (const p of parts) {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 1 - p.age / p.life;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    if (state !== 'title') {
      for (const b of bats) drawBat(b);
      if (state === 'play') drawNet();
    }
    // score pops
    ctx.textAlign = 'center';
    ctx.font = '700 16px "Zen Kaku Gothic New", system-ui, sans-serif';
    for (const p of pops) {
      ctx.globalAlpha = 1 - p.age;
      ctx.fillStyle = p.gold ? '#ffd76a' : '#d9f26b';
      ctx.fillText(p.text, p.x, p.y - p.age * 30);
    }
    ctx.globalAlpha = 1;
    // slow-time tint
    if (state === 'play' && slowTimer > 0) {
      ctx.fillStyle = `rgba(255,215,106,${Math.min(slowTimer, 1) * 0.06})`;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  // ---------- loop ----------
  let last = performance.now(), paused = false;
  document.addEventListener('visibilitychange', () => { paused = document.hidden; last = performance.now(); });
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 20);
    last = now;
    if (!paused) {
      if (state === 'play') update(dt); else updateAmbient(dt);
      draw();
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  reset();
  renderHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
